<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <title>PIXELFALL</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="game-wrapper">


    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="logo">
            PIXEL<span>FALL</span>
        </div>


        <div class="stats">

            <div>
                ⭐
                <span id="score">0</span>
            </div>

            <div>
                💎
                <span id="coins">0</span>
            </div>

            <div>
                ❤️
                <span id="lives">3</span>
            </div>

        </div>


        <div class="top-buttons">

            <button
                id="soundBtn"
                class="icon-btn"
                type="button"
                aria-label="Toggle sound"
            >
                🔊
            </button>

            <button
                id="pauseBtn"
                class="icon-btn"
                type="button"
            >
                Ⅱ
            </button>

        </div>

    </header>



    <!-- =========================
         GAME AREA
    ========================== -->

    <main class="game-container">

        <canvas id="gameCanvas"></canvas>



        <!-- =========================
             START SCREEN
        ========================== -->

        <section
            id="startScreen"
            class="overlay"
        >

            <div class="menu-card">

                <div class="ghost-logo">
                    👻
                </div>


                <h1>
                    PIXEL<span>FALL</span>
                </h1>


                <p>
                    Survive the darkness.
                </p>


                <button
                    id="startBtn"
                    class="main-btn"
                    type="button"
                >
                    PLAY GAME
                </button>


                <div class="controls">

                    <p>
                        <b>W A S D</b> /
                        <b>ARROWS</b>
                        — Move
                    </p>

                    <p>
                        <b>SPACE</b>
                        — Dash
                    </p>

                    <p>
                        <b>P</b>
                        — Pause
                    </p>

                </div>

            </div>

        </section>



        <!-- =========================
             PAUSE SCREEN
        ========================== -->

        <section
            id="pauseScreen"
            class="overlay hidden"
        >

            <div class="menu-card">

                <h2>
                    GAME PAUSED
                </h2>


                <button
                    id="resumeBtn"
                    class="main-btn"
                    type="button"
                >
                    RESUME
                </button>


                <button
                    id="restartPauseBtn"
                    class="secondary-btn"
                    type="button"
                >
                    RESTART
                </button>

            </div>

        </section>



        <!-- =========================
             GAME OVER
        ========================== -->

        <section
            id="gameOverScreen"
            class="overlay hidden"
        >

            <div class="menu-card">

                <div class="ghost-logo">
                    💀
                </div>


                <h2>
                    GAME OVER
                </h2>


                <p>
                    Your Score
                </p>


                <div
                    id="finalScore"
                    class="final-score"
                >
                    0
                </div>


                <p>
                    High Score:
                    <b id="highScore">0</b>
                </p>


                <div class="game-over-buttons">

                    <button
                        id="restartBtn"
                        class="main-btn"
                        type="button"
                    >
                        PLAY AGAIN
                    </button>


                    <button
                        id="closeGameBtn"
                        class="close-btn"
                        type="button"
                    >
                        CLOSE GAME
                    </button>

                </div>

            </div>

        </section>



        <!-- =========================
             LEVEL MESSAGE
        ========================== -->

        <div
            id="levelMessage"
            class="level-message hidden"
        >
            LEVEL 1
        </div>



        <!-- =========================
             MOBILE CONTROLS
        ========================== -->

        <div
            id="mobileControls"
            class="mobile-controls"
        >

            <div
                id="joystick"
                class="joystick"
            >

                <div
                    id="joystickKnob"
                    class="joystick-knob"
                ></div>

            </div>


            <button
                id="dashBtn"
                class="dash-button"
                type="button"
            >

                ⚡

                <span>
                    DASH
                </span>

            </button>

        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <span>
            PIXELFALL
        </span>

        <span>
            Survive • Collect • Escape
        </span>

    </footer>

</div>


<script src="game.js"></script>

</body>

</html>
